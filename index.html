<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050607">
<title>RY-L1390 — Kinetic Assembly</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#f5f6f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
.scene{position:fixed;inset:0;overflow:hidden;background:#050607}
.grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;width:850px;height:850px;max-width:100vw;max-height:100vw;left:50%;top:59%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(23,86,137,.17),transparent 67%);pointer-events:none}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,transparent 28%,rgba(0,0,0,.76) 100%);pointer-events:none}
.top{position:absolute;z-index:30;top:max(14px,env(safe-area-inset-top));left:20px;right:20px;height:50px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:10px;font-weight:700;letter-spacing:.25em}.status{font-size:9px;letter-spacing:.18em;color:#8d9490;text-transform:uppercase}.led{display:inline-block;width:6px;height:6px;border-radius:50%;background:#dca84c;box-shadow:0 0 14px #dca84c;margin-right:8px}
.copy{position:absolute;z-index:30;left:22px;right:22px;top:98px;pointer-events:none}
.eyebrow{font-size:9px;letter-spacing:.27em;color:#727a76;text-transform:uppercase}
h1{font-size:clamp(43px,11vw,78px);line-height:.88;letter-spacing:-.065em;font-weight:500;margin:14px 0 18px}
.copy p{font-size:13px;line-height:1.6;color:#929995;max-width:380px;margin:0}
.canvas{position:absolute;z-index:5;left:50%;top:65%;width:min(1050px,116vw);aspect-ratio:1000/820;transform:translate(-50%,-50%);pointer-events:none}
svg{display:block;width:100%;height:100%;overflow:visible}
.part{filter:drop-shadow(0 15px 13px rgba(0,0,0,.22));opacity:1}
.hud{position:absolute;z-index:30;right:20px;bottom:84px;width:160px;font-size:8px;letter-spacing:.17em;color:#737975;text-transform:uppercase;opacity:0}
.row{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.09);padding:8px 0}.row b{font-weight:500;color:#e7e9e6}
.bottom{position:absolute;z-index:30;left:20px;right:20px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.17em;color:#707671;text-transform:uppercase}
.line{width:95px;height:1px;background:rgba(255,255,255,.11)}.line i{display:block;width:0;height:100%;background:#dda94f;box-shadow:0 0 12px #dda94f}
.hint{position:absolute;z-index:30;right:10px;top:55%;writing-mode:vertical-rl;font-size:8px;letter-spacing:.24em;color:#626864;transition:opacity .3s}
.beam{position:absolute;width:3px;height:145px;background:linear-gradient(#fff,#ffd36b,transparent);box-shadow:0 0 20px #f0b54a;opacity:0;transform-origin:top}
.impact{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 9px #fff,0 0 28px #e6ad48,0 0 55px rgba(230,173,72,.7);opacity:0;transform:translate(-50%,-50%)}
@media(min-width:700px){.copy{left:5vw;top:13vh}.canvas{top:62%;width:min(1050px,88vw)}}
</style>
</head>
<body>

<header class="top"><div class="logo">RY-L1390 / CO₂ LASER</div><div class="status"><span class="led" id="led"></span><span id="status">EXPLODED SYSTEM</span></div></header>
<section class="copy"><div class="eyebrow">Kinetic assembly / 01</div><h1>Every part.<br>In its place.</h1><p>Проведи пальцем вниз. Детали сходятся по своим траекториям, фиксируются и запускают рабочий цикл.</p></section>

/g></g><g class="part" data-x="245" data-y="455" data-i="5"><g><rect x="175" y="455" width="690" height="42" rx="5" fill="#161b1f" stroke="#07090a" stroke-width="4"/><rect x="210" y="465" width="620" height="12" fill="#707a80"/><rect x="190" y="447" width="30" height="60" fill="#30373b"/><rect x="810" y="447" width="30" height="60" fill="#30373b"/></g></g><g class="part" data-x="570" data-y="430" data-i="6"><g><path d="M488 450h55l12 25v68l-13 17h-52l-13-17v-68Z" fill="#1b2226" stroke="#07090a" stroke-width="4"/><rect x="500" y="462" width="31" height="18" fill="#e5b04a"/><rect x="496" y="492" width="39" height="34" fill="#2e363a"/><path d="M514 526v27" stroke="#d1d5d5" stroke-width="5"/><circle cx="514" cy="558" r="8" fill="#e4b24d"/></g></g><g class="part" data-x="270" data-y="70" data-i="7"><g><path d="M205 180Q210 145 245 132H755Q790 145 795 180L775 360Q772 375 750 380H250Q228 375 225 360Z" fill="#0d61a7" stroke="#062c4c" stroke-width="5"/><rect x="250" y="205" width="500" height="135" rx="8" fill="#dfe4e5" stroke="#092f50" stroke-width="8"/><rect x="266" y="220" width="468" height="105" fill="#f7f8f7" stroke="#9da6ab" stroke-width="3"/></g></g><g class="part" data-x="970" data-y="330" data-i="8"><g><path d="M815 345h100l25 25v170H815Z" fill="#e2e5e6" stroke="#555d62" stroke-width="4"/><rect x="835" y="365" width="70" height="52" fill="#1e2529"/><rect x="845" y="375" width="50" height="22" fill="#a6d7e9"/><circle cx="845" cy="440" r="9" fill="#db3f36"/><circle cx="875" cy="440" r="9" fill="#e5b04a"/><circle cx="845" cy="470" r="8" fill="#2e7ec0"/><circle cx="875" cy="470" r="8" fill="#58a76a"/></g></g><g class="part" data-x="120" data-y="95" data-i="9"><g><path d="M190 140L165 315" stroke="#252a2e" stroke-width="13" stroke-linecap="round"/><path d="M190 140L165 315" stroke="#d2d5d5" stroke-width="5"/><circle cx="190" cy="140" r="10" fill="#60696e"/><circle cx="165" cy="315" r="10" fill="#60696e"/></g></g><g class="part" data-x="950" data-y="105" data-i="10"><g><path d="M805 140L830 315" stroke="#252a2e" stroke-width="13" stroke-linecap="round"/><path d="M805 140L830 315" stroke="#d2d5d5" stroke-width="5"/><circle cx="805" cy="140" r="10" fill="#60696e"/><circle cx="830" cy="315" r="10" fill="#60696e"/></g></g><g class="part" data-x="260" data-y="-40" data-i="11"><g><path d="M170 120L205 70Q215 58 232 58H768Q785 58 795 70L830 120Z" fill="#1c6db4" stroke="#082e4d" stroke-width="5"/><path d="M250 82l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28m8-28l15 28" stroke="#092f4e" stroke-width="5"/><rect x="480" y="65" width="70" height="26" rx="8" fill="#b9c0c2"/></g></g><g class="part" data-x="200" data-y="760" data-i="12"><g><circle cx="220" cy="745" r="25" fill="#161a1d" stroke="#8c9498" stroke-width="5"/><circle cx="220" cy="745" r="9" fill="#b5bdc0"/><circle cx="800" cy="745" r="25" fill="#161a1d" stroke="#8c9498" stroke-width="5"/><circle cx="800" cy="745" r="9" fill="#b5bdc0"/></g></g></svg>
<div class="beam" id="beam"></div><div class="impact" id="impact"></div>
</div>
<div class="hud" id="hud"><div class="row"><span>MODE</span><b id="mode">ASSEMBLY</b></div><div class="row"><span>SYSTEM</span><b id="system">OFFLINE</b></div><div class="row"><span>POWER</span><b id="power">00%</b></div><div class="row"><span>HEAD</span><b id="head">—</b></div></div>
<div class="bottom"><span>SCROLL TO ASSEMBLE</span><span class="line"><i id="bar"></i></span><span id="pct">00%</span></div>
<div class="hint" id="hint">SWIPE ↓ TO ASSEMBLE</div>
<div class="bottom"><span>GESTURE CONTROL</span><span class="line"><i id="bar"></i></span><span id="pct">00%</span></div>
</div>
<script>
(()=>{
const scene=document.getElementById('scene');
const parts=[...document.querySelectorAll('.part')];
const bar=document.getElementById('bar'),pct=document.getElementById('pct');
const status=document.getElementById('status'),led=document.getElementById('led');
const hud=document.getElementById('hud'),mode=document.getElementById('mode'),system=document.getElementById('system'),power=document.getElementById('power'),head=document.getElementById('head');
const beam=document.getElementById('beam'),impact=document.getElementById('impact'),hint=document.getElementById('hint');

let target=0,current=0,drag=false,lastY=0,lastTime=0,velocity=0;

const clamp=v=>Math.max(0,Math.min(1,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};

function begin(y){drag=true;lastY=y;lastTime=performance.now();velocity=0}
function move(y){
 if(!drag)return;
 const now=performance.now(),dy=lastY-y,dt=Math.max(8,now-lastTime);
 velocity=dy/dt;lastY=y;lastTime=now;
 target=clamp(target+dy/(innerHeight*.68));
}
function finish(){
 if(!drag)return;
 drag=false;
 if(Math.abs(velocity)>.30)target=clamp(target+velocity*.18);
}

scene.addEventListener('touchstart',e=>{if(e.touches.length===1)begin(e.touches[0].clientY)},{passive:true});
scene.addEventListener('touchmove',e=>{if(e.touches.length===1){e.preventDefault();move(e.touches[0].clientY)}},{passive:false});
scene.addEventListener('touchend',finish,{passive:true});
scene.addEventListener('touchcancel',finish,{passive:true});

scene.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')begin(e.clientY)});
scene.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&drag)move(e.clientY)});
scene.addEventListener('pointerup',finish);

scene.addEventListener('wheel',e=>{target=clamp(target+e.deltaY/(innerHeight*1.8))},{passive:true});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();target=clamp(target+.08)}
 if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();target=clamp(target-.08)}
 if(e.key==='Home'){e.preventDefault();target=0}
 if(e.key==='End'){e.preventDefault();target=1}
});

function render(t){
 current+=(target-current)*.14;
 const assembly=ease(current/.78);
 const work=ease((current-.78)/.22);

 parts.forEach((el,i)=>{
   const sx=Number(el.dataset.x)||0, sy=Number(el.dataset.y)||0;
   const delay=i*.018;
   const q=ease((assembly-delay)/.90);
   const wobble=(1-q)*Math.sin(t*.0018+i*1.47)*1.2;
   const rot=(1-q)*((i%3)-1)*6;
   // SVG transform attribute is stable on iOS Safari; no CSS transform-box dependency.
   el.setAttribute('transform',`translate(${(sx*(1-q)+wobble).toFixed(2)} ${(sy*(1-q)).toFixed(2)}) rotate(${rot.toFixed(2)} 500 500)`);
   el.style.opacity=(.88+.12*q).toFixed(3);
 });

 const n=Math.round(current*100);
 bar.style.width=n+'%';pct.textContent=String(n).padStart(2,'0')+'%';

 if(current<.78){
   hud.style.opacity=0;beam.style.opacity=0;impact.style.opacity=0;
   status.textContent=assembly>.96?'ASSEMBLY LOCKED':'EXPLODED SYSTEM';
   led.style.background=assembly>.96?'#72e3a9':'#dca84c';
   hint.style.opacity=current>.06?.12:1;
 }else{
   hud.style.opacity=.32+.68*work;
   mode.textContent=work>.12?'PRECISION CUT':'STARTING';
   system.textContent=work>.12?'ONLINE':'IGNITION';
   power.textContent=String(Math.round(work*100)).padStart(2,'0')+'%';
   status.textContent='SYSTEM ONLINE';led.style.background='#72e3a9';hint.style.opacity=0;
   const travel=.5+.5*Math.sin(t*.00135);
   const x=49+travel*34,y=57;
   head.textContent=Math.round(travel*100)+'%';
   beam.style.left=x+'%';beam.style.top=y+'%';impact.style.left=x+'%';impact.style.top=(y+17)+'%';
   beam.style.opacity=.15+.85*work;impact.style.opacity=.2+.8*work;
 }
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
})();
</script>
</body>
</html>
