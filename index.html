<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050607">
<title>RY-L1390 — Kinetic Assembly</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#f4f5f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
.scene{position:fixed;inset:0;overflow:hidden;background:#050607}
.grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;width:75vw;height:75vw;max-width:850px;max-height:850px;left:50%;top:58%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(24,83,132,.17),transparent 65%);pointer-events:none}
.vignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.72) 100%);pointer-events:none}
.top{position:absolute;z-index:20;top:max(12px,env(safe-area-inset-top));left:20px;right:20px;height:52px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:10px;font-weight:700;letter-spacing:.25em}.status{font-size:9px;letter-spacing:.18em;color:#8b928e}.led{display:inline-block;width:6px;height:6px;border-radius:50%;background:#dba647;box-shadow:0 0 13px #dba647;margin-right:8px}
.copy{position:absolute;z-index:20;left:22px;right:22px;top:96px;pointer-events:none}
.eyebrow{font-size:9px;letter-spacing:.26em;color:#737a76;text-transform:uppercase}
h1{font-size:clamp(43px,11vw,78px);line-height:.88;letter-spacing:-.065em;font-weight:500;margin:14px 0 18px}
.copy p{font-size:13px;line-height:1.6;color:#929995;max-width:380px;margin:0}
.canvas{position:absolute;z-index:5;left:50%;top:61%;width:min(1050px,112vw);aspect-ratio:1000/820;transform:translate(-50%,-50%)}
svg{display:block;width:100%;height:100%;overflow:visible}
.part{transform-origin:500px 500px}
.hud{position:absolute;z-index:20;right:20px;bottom:82px;width:160px;font-size:8px;letter-spacing:.17em;color:#737975;text-transform:uppercase;opacity:.08}
.row{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.09);padding:8px 0}.row b{font-weight:500;color:#e4e7e4}
.bottom{position:absolute;z-index:20;left:20px;right:20px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;color:#707671;font-size:8px;letter-spacing:.17em;text-transform:uppercase}
.line{width:95px;height:1px;background:rgba(255,255,255,.11)}.line i{display:block;width:0;height:100%;background:#dda94f;box-shadow:0 0 12px #dda94f}
.hint{position:absolute;z-index:20;right:10px;top:53%;writing-mode:vertical-rl;color:#606662;font-size:8px;letter-spacing:.24em;transition:opacity .3s}
.laser{position:absolute;width:3px;height:145px;background:linear-gradient(#fff,#ffd36b,transparent);box-shadow:0 0 18px #efb64f;opacity:0;transform-origin:top;pointer-events:none}
.dot{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 9px #fff,0 0 28px #e6a83d,0 0 50px rgba(230,168,61,.7);opacity:0;transform:translate(-50%,-50%);pointer-events:none}
@media(min-width:700px){.copy{left:5vw;top:13vh}.canvas{top:59%;width:min(1050px,88vw)}}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="grid"></div><div class="glow"></div><div class="vignette"></div>
<header class="top"><div class="logo">RY-L1390 / CO₂ LASER</div><div class="status"><span class="led" id="led"></span><span id="status">EXPLODED SYSTEM</span></div></header>
<section class="copy"><div class="eyebrow">Kinetic assembly / 01</div><h1>Every part.<br>In its place.</h1><p>Проведи пальцем вниз. Каждая деталь имеет собственную траекторию и собирается в единый механизм.</p></section>
<div class="canvas" id="canvas">
<svg id="machine" viewBox="0 0 1000 820" preserveAspectRatio="xMidYMid meet" aria-label="RY-L1390">
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4f6f6"/><stop offset=".35" stop-color="#aeb7bc"/><stop offset=".58" stop-color="#e7eaeb"/><stop offset="1" stop-color="#747e84"/></linearGradient>
<linearGradient id="whiteMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#c9d0d3"/><stop offset="1" stop-color="#747e84"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2388d0"/><stop offset=".4" stop-color="#1166a8"/><stop offset="1" stop-color="#083d69"/></linearGradient>
<linearGradient id="blueDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1676bd"/><stop offset=".45" stop-color="#0b5591"/><stop offset="1" stop-color="#063354"/></linearGradient>
<linearGradient id="bed" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9da6aa"/><stop offset=".45" stop-color="#4e585d"/><stop offset="1" stop-color="#242a2e"/></linearGradient>
<linearGradient id="blackMetal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4c565b"/><stop offset=".3" stop-color="#171d20"/><stop offset="1" stop-color="#080b0d"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#e9f2f4"/><stop offset="1" stop-color="#c9d4d8"/></linearGradient>
<linearGradient id="headMetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b656a"/><stop offset=".5" stop-color="#151b1e"/><stop offset="1" stop-color="#343c40"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity=".32"/></filter>
</defs>
<g filter="url(#shadow)">
{parts}
</g>
</svg>
<div class="laser" id="laser"></div><div class="dot" id="dot"></div>
</div>
<div class="hud" id="hud"><div class="row"><span>MODE</span><b id="mode">ASSEMBLY</b></div><div class="row"><span>SYSTEM</span><b id="system">OFFLINE</b></div><div class="row"><span>POWER</span><b id="power">00%</b></div><div class="row"><span>HEAD</span><b id="head">—</b></div></div>
<div class="hint" id="hint">SWIPE ↓ TO ASSEMBLE</div>
<div class="bottom"><span>GESTURE CONTROL</span><span class="line"><i id="bar"></i></span><span id="pct">00%</span></div>
</div>
<script>
(function(){
const scene=document.getElementById('scene'), groups=[...document.querySelectorAll('.part')];
const bar=document.getElementById('bar'),pct=document.getElementById('pct'),status=document.getElementById('status'),led=document.getElementById('led');
const hud=document.getElementById('hud'),mode=document.getElementById('mode'),system=document.getElementById('system'),power=document.getElementById('power'),head=document.getElementById('head'),hint=document.getElementById('hint'),laser=document.getElementById('laser'),dot=document.getElementById('dot');
let value=0,target=0,drag=false,lastY=0,lastTime=0,velocity=0;

function clamp(x){return Math.max(0,Math.min(1,x))}
function smooth(x){x=clamp(x);return x*x*(3-2*x)}
function start(y){drag=true;lastY=y;lastTime=performance.now();velocity=0}
function move(y){
 if(!drag)return;
 const now=performance.now(),dy=lastY-y,dt=Math.max(10,now-lastTime);
 velocity=dy/dt;lastY=y;lastTime=now;
 target=clamp(target+dy/(innerHeight*.62));
}
function end(){
 if(!drag)return;drag=false;
 if(Math.abs(velocity)>.28) target=clamp(target+velocity*.16);
}
scene.addEventListener('touchstart',e=>{if(e.touches.length===1){start(e.touches[0].clientY)}},{passive:true});
scene.addEventListener('touchmove',e=>{if(e.touches.length===1){e.preventDefault();move(e.touches[0].clientY)}},{passive:false});
scene.addEventListener('touchend',end,{passive:true});
scene.addEventListener('touchcancel',end,{passive:true});
scene.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')start(e.clientY)});
scene.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&drag)move(e.clientY)});
scene.addEventListener('pointerup',end);
scene.addEventListener('wheel',e=>{target=clamp(target+e.deltaY/(innerHeight*1.7))},{passive:true});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();target=clamp(target+.08)}
 if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();target=clamp(target-.08)}
 if(e.key==='Home'){e.preventDefault();target=0}
 if(e.key==='End'){e.preventDefault();target=1}
});

function draw(t){
 value+=(target-value)*.14;
 const a=smooth(value/.78), work=smooth((value-.78)/.22);
 groups.forEach((g,i)=>{
   const sx=Number(g.dataset.x)||0,sy=Number(g.dataset.y)||0,sr=Number(g.dataset.r)||0;
   const q=smooth((a-i*.018)/.91);
   const micro=(1-q)*Math.sin(t*.002+i*1.41)*1.4;
   // SVG transform attribute: reliable on iOS Safari and does not depend on CSS transform-box.
   g.setAttribute('transform','translate('+(sx*(1-q)+micro).toFixed(2)+' '+(sy*(1-q)).toFixed(2)+') rotate('+(sr*(1-q)).toFixed(2)+' 500 500)');
 });
 const n=Math.round(value*100);bar.style.width=n+'%';pct.textContent=String(n).padStart(2,'0')+'%';
 if(value<.78){
   hud.style.opacity='.08';laser.style.opacity=0;dot.style.opacity=0;
   status.textContent=a>.97?'ASSEMBLY LOCKED':'EXPLODED SYSTEM';led.style.background=a>.97?'#72e3a9':'#dba647';
   hint.style.opacity=value>.06?.12:1;
 }else{
   hud.style.opacity=.3+.7*work;mode.textContent=work>.12?'PRECISION CUT':'STARTING';system.textContent=work>.12?'ONLINE':'IGNITION';
   power.textContent=String(Math.round(work*100)).padStart(2,'0')+'%';status.textContent='SYSTEM ONLINE';led.style.background='#72e3a9';hint.style.opacity=0;
   const travel=.5+.5*Math.sin(t*.00135),x=49+travel*34,y=57;
   head.textContent=Math.round(travel*100)+'%';laser.style.left=x+'%';laser.style.top=y+'%';dot.style.left=x+'%';dot.style.top=(y+17)+'%';
   laser.style.opacity=.15+.85*work;dot.style.opacity=.2+.8*work;
 }
 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
</body></html>
