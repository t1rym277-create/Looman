<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

    });

  <script>
    tailwind.config = {
      theme: {
        extend: {

            heading: ["Instrument Serif", "serif"],
            body: ["Barlow", "sans-serif"]

          borderRadius: { DEFAULT: "9999px" }

  <style>
    * { box-sizing: border-box; }

    ::selection { background:rgba(255,255,255,.9); color:#000; }

    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
      background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
    }
    .liquid-glass-strong {
      background:rgba(255,255,255,.01);
      background-blend-mode:luminosity;
      backdrop-filter:blur(50px); -webkit-backdrop-filter:blur(50px);
      border:none;
      box-shadow:4px 4px 4px rgba(0,0,0,.05),inset 0 1px 1px rgba(255,255,255,.15);
      position:relative; overflow:hidden;
    }
    .liquid-glass-strong::before {
      content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
      background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.2) 80%,rgba(255,255,255,.5) 100%);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
    }

    .grain {
      pointer-events:none; position:absolute; inset:0; z-index:40; opacity:.035;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      mix-blend-mode:screen;
    }

    .wood-texture {
      background:
        linear-gradient(90deg,rgba(0,0,0,.04),rgba(255,255,255,.06),rgba(0,0,0,.05)),

    .laser-beam { animation:laserPulse 1.15s ease-in-out infinite; transform-origin:center; }
    @keyframes laserPulse { 0%,100%{opacity:.25} 50%{opacity:1} }

    .head-travel { animation:headTravel 5.8s ease-in-out infinite; }
    @keyframes headTravel {
      0%{transform:translate(0,0)}
      18%{transform:translate(190px,0)}
      37%{transform:translate(190px,78px)}
      55%{transform:translate(55px,78px)}
      72%{transform:translate(55px,25px)}
      100%{transform:translate(0,0)}
    }

    .cut-path { stroke-dasharray:700; stroke-dashoffset:700; animation:cut 5.8s linear infinite; }
    @keyframes cut { 0%,12%{stroke-dashoffset:700} 72%,100%{stroke-dashoffset:0} }

    .particle { animation:particle 2.2s ease-in-out infinite; opacity:0; }
    @keyframes particle {
      0%,35%{opacity:0;transform:translate(0,0) scale(.5)}
      50%{opacity:.8}
      100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}
    }

    .wood-grain-line { opacity:.32; fill:none; stroke:#4a301f; stroke-width:1.2; }
    .glass-highlight { background:linear-gradient(110deg,rgba(255,255,255,.12),transparent 35%,transparent 70%,rgba(255,255,255,.05)); }

    @media(max-width:768px){
      .machine-svg { transform:scale(.8); transform-origin:center; }

<body>
<div id="root"></div>

<script type="text/babel">
const { motion, AnimatePresence } = window.Motion;

const Icon = ({type, className="w-6 h-6", fill=false}) => {
  const paths = {
    arrow: <><path d="M7 17L17 7"/><path d="M7 7h10v10"/></>,
    play: <path d="M6 4l14 8-14 8V4Z" fill="currentColor" stroke="none"/>,
    clock: <><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></>,
    globe: <><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.2 2.3 3.2 5.1 3.2 8.5s-1 6.2-3.2 8.5c-2.2-2.3-3.2-5.1-3.2-8.5s1-6.2 3.2-8.5Z"/></>,
    ruler: <><path d="M4 16.5 16.5 4 20 7.5 7.5 20H4v-3.5Z"/><path d="m12 8 4 4M9 11l3 3M15 5l4 4"/></>,
    wood: <><path d="M5 20c0-6 1.5-11 7-16 5.5 5 7 10 7 16"/><path d="M8 17c3-2 5-4 8-8M8 12c2-1 3-2 4-4"/></>,
    laser: <><path d="M4 5h16v13H4z"/><path d="M8 18v2M16 18v2M7 8h10M9 11h6"/><path d="M12 11v6"/></>,
    finish: <><path d="M14 4 20 10"/><path d="m12 6 6 6"/><path d="M4 20c3-4 5-6 9-9l2 2c-3 4-5 6-9 9H4Z"/></>,
    check: <path d="m5 12 4 4L19 6"/>
  };
  return <svg className={className} viewBox="0 0 24 24" fill={fill ? "currentColor":"none"} stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{paths[type]}</svg>
};

function FadingVideo({src, className=""}) {
  const ref = React.useRef(null), raf = React.useRef(null), fading = React.useRef(false);
  const FADE_MS=500, LEAD=.55;
  const fadeTo=(target,duration=FADE_MS)=>{
    const v=ref.current; if(!v) return;
    if(raf.current) cancelAnimationFrame(raf.current);
    const start=parseFloat(v.style.opacity || "0");
    const t0=performance.now();
    const tick=(now)=>{
      const p=Math.min(1,(now-t0)/duration);
      const eased=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      v.style.opacity=String(start+(target-start)*eased);
      if(p<1) raf.current=requestAnimationFrame(tick);
    };
    raf.current=requestAnimationFrame(tick);
  };
  React.useEffect(()=>{
    const v=ref.current; if(!v) return;
    const loaded=()=>{v.style.opacity="0";v.play().catch(()=>{});fadeTo(1)};
    const time=()=>{
      if(!fading.current && v.duration && v.duration-v.currentTime<=LEAD && v.duration-v.currentTime>0){
        fading.current=true; fadeTo(0);
      }
    };
    const ended=()=>{
      v.style.opacity="0";
      setTimeout(()=>{v.currentTime=0;v.play().catch(()=>{});fading.current=false;fadeTo(1)},100);
    };
    v.addEventListener("loadeddata",loaded); v.addEventListener("timeupdate",time); v.addEventListener("ended",ended);
    if(v.readyState>=2) loaded();
    return()=>{if(raf.current)cancelAnimationFrame(raf.current);v.removeEventListener("loadeddata",loaded);v.removeEventListener("timeupdate",time);v.removeEventListener("ended",ended)}
  },[]);
  return <video ref={ref} autoPlay muted playsInline preload="auto" className={className} style={{opacity:0}} src={src}/>;
}

function BlurText({children,className=""}){
  const ref=React.useRef(null),[show,setShow]=React.useState(false);
  React.useEffect(()=>{
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting)setShow(true)},{threshold:.1});
    if(ref.current)io.observe(ref.current); return()=>io.disconnect();
  },[]);
  const words=String(children).split(" ");
  return <p ref={ref} className={className}>{words.map((w,i)=>
    <motion.span key={i} initial={{filter:"blur(10px)",opacity:0,y:50}} animate={show?{filter:"blur(0px)",opacity:1,y:0}:{}} transition={{duration:.7,delay:i*.1,ease:"easeOut"}} style={{display:"inline-block",marginRight:".28em"}}>{w}</motion.span>
  )}</p>
}

function AnimatedMachine(){
  return <div className="relative w-full max-w-[760px] aspect-[1.35] machine-shadow select-none">
    <svg className="machine-svg w-full h-full" viewBox="0 0 760 560">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#343434"/><stop offset=".45" stopColor="#111"/><stop offset="1" stopColor="#292929"/></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="rgba(255,255,255,.16)"/><stop offset=".45" stopColor="rgba(255,255,255,.025)"/><stop offset="1" stopColor="rgba(255,255,255,.1)"/></linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <!-- floor -->
      <ellipse cx="380" cy="505" rx="290" ry="24" fill="#000" opacity=".75"/>
      <!-- machine frame -->
      <path d="M90 100h580v345H90z" fill="url(#metal)" stroke="#666" strokeWidth="2"/>
      <path d="M108 118h544v285H108z" fill="#080808" stroke="#2c2c2c" strokeWidth="2"/>
      <!-- transparent door -->
      <path d="M130 138h500v250H130z" fill="url(#glass)" stroke="rgba(255,255,255,.25)" strokeWidth="2"/>
      <path d="M140 148h480v230H140z" fill="rgba(10,10,10,.28)"/>
      <!-- rails -->
      <rect x="160" y="166" width="440" height="8" rx="4" fill="#6b6b6b"/>
      <rect x="180" y="175" width="400" height="4" rx="2" fill="#222"/>
      <rect x="170" y="355" width="420" height="8" rx="4" fill="#555"/>
      <!-- work bed -->
      <rect x="185" y="225" width="390" height="145" rx="3" fill="#181818" stroke="#444"/>
      <rect x="205" y="240" width="350" height="115" rx="2" className="wood-texture"/>
      <!-- decorative cut -->
      <path className="cut-path" d="M250 315 C275 270 310 270 330 310 C350 350 385 350 405 305 C425 260 465 260 490 305 C505 332 520 335 535 310" fill="none" stroke="#1f130b" strokeWidth="5"/>
      <path d="M250 315 C275 270 310 270 330 310 C350 350 385 350 405 305 C425 260 465 260 490 305 C505 332 520 335 535 310" fill="none" stroke="#c79a6b" strokeWidth="1" opacity=".45"/>
      <!-- machine control -->
      <rect x="620" y="190" width="25" height="105" rx="3" fill="#151515" stroke="#555"/>
      <circle cx="632" cy="210" r="4" fill="#fff"/><circle cx="632" cy="230" r="4" fill="#555"/><circle cx="632" cy="250" r="4" fill="#555"/>
      <!-- gantry/head -->
      <g className="head-travel">
        <rect x="190" y="162" width="12" height="203" rx="5" fill="#777"/>
        <rect x="187" y="177" width="70" height="9" rx="4" fill="#9a9a9a"/>
        <rect x="225" y="180" width="27" height="38" rx="4" fill="#222" stroke="#777"/>
        <path d="M235 218h8l7 20h-22l7-20Z" fill="#111" stroke="#777"/>
        <path className="laser-beam" d="M239 238v32" stroke="#fff" strokeWidth="2" filter="url(#glow)"/>
        <circle className="laser-beam" cx="239" cy="271" r="6" fill="#fff" filter="url(#glow)"/>
      </g>
      <!-- legs -->
      <path d="M110 445v38M650 445v38" stroke="#222" strokeWidth="18"/>
      <path d="M92 483h60M620 483h60" stroke="#444" strokeWidth="8" strokeLinecap="round"/>
      <!-- particles -->
      {[...Array(12)].map((_,i)=><circle key={i} className="particle" style={{"--dx":`${(i%4-1.5)*18}px`,"--dy":`${-20-(i%3)*12}px`,animationDelay:`${i*.17}s`}} cx={235+i*22} cy={275+(i%3)*7} r="1.5" fill="#fff"/>)}
      <!-- glass reflection -->
      <path d="M150 145h145L205 385h-55z" fill="white" opacity=".025"/>
    </svg>
    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 liquid-glass rounded-full px-4 py-2 text-xs text-white/80 whitespace-nowrap">
      Лазерная резка · точность до 0,1 мм
    </div>
  </div>
}

const materials = {
  "Дуб": "Плотная древесина с выраженной текстурой. Подходит для столов, фасадов, лестниц и мебели на долгие годы.",
  "Ясень": "Светлая порода с контрастным рисунком. Хорошо подчёркивает современный и минималистичный интерьер.",
  "Орех": "Глубокий благородный оттенок и выразительная текстура для акцентной мебели и премиальных деталей.",
  "Сосна": "Тёплая светлая древесина с естественными сучками. Отличный вариант для окон, панелей и уютных интерьеров.",
  "МДФ": "Стабильный листовой материал с однородной структурой для фасадов, панелей и окрашенных элементов.",
  "Фанера": "Многослойный материал с характерным торцом. Используется там, где важны прочность и точная геометрия."
};

function Reveal({children,delay=0,className=""}){
  return <motion.div className={className} initial={{opacity:0,filter:"blur(10px)",y:25}} whileInView={{opacity:1,filter:"blur(0px)",y:0}} viewport={{once:true,amount:.12}} transition={{duration:.75,delay,ease:"easeOut"}}>{children}</motion.div>
}

function GlassCard({children,className=""}){ return <div className={`liquid-glass rounded-[1.25rem] ${className}`}>{children}</div> }

  const [menu,setMenu]=React.useState(false);

        <a href="#contact" className="bg-white text-black rounded-full px-4 py-2 text-sm font-medium flex items-center gap-2 whitespace-nowrap">Рассчитать проект <Icon type="arrow" className="w-4 h-4"/></a>
      </div>
      <button onClick={()=>setMenu(!menu)} className="md:hidden liquid-glass w-12 h-12 rounded-full flex flex-col items-center justify-center gap-1.5" aria-label="Меню">
        <span className="w-4 h-px bg-white"/><span className="w-4 h-px bg-white"/>
      </button>

    </nav>

      <div className="relative z-10 flex-1 min-h-screen flex flex-col items-center justify-center pt-24 px-4 text-center">
        <Reveal delay={.25}>

            <span className="text-sm text-white/90 pr-3">Мебель и интерьер из натурального дерева</span>

      <div className="relative z-10">
        <Reveal><p className="text-sm text-white/70 mb-6">// Материалы</p></Reveal>
        <Reveal delay={.1}><h2 className="font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[.9] tracking-[-3px]">Настоящее<br/>дерево в деталях</h2></Reveal>

        <div className="mt-16 grid lg:grid-cols-[1fr_1.3fr] gap-6">
          <Reveal>
            <GlassCard className="p-6 min-h-[420px]">

                <p className="text-white/80 font-light leading-snug max-w-[44ch] mt-4">{materials[material]}</p>
              </div>
              <div className="mt-10 h-24 rounded-[1rem] wood-texture relative overflow-hidden">
                <div className="absolute inset-0 glass-highlight"/>
              </div>
            </GlassCard>
          </Reveal>

          <div className="grid md:grid-cols-2 gap-6">
            {[
              ["Натуральный массив","Дуб, ясень, орех и сосна — подбираем породу под задачу и интерьер."],
              ["Шпон и МДФ","Стабильные материалы для фасадов, панелей и сложных геометрических элементов."],
              ["Фанера","Прочный многослойный материал с выразительным торцом и точной геометрией."],
              ["Финиш","Масло, воск или лак подчёркивают фактуру и защищают поверхность."]
            ].map(([title,text],i)=><Reveal key={title} delay={i*.08}>
              <GlassCard className="p-6 min-h-[195px] flex flex-col">
                <div className="w-11 h-11 liquid-glass rounded-[.75rem] flex items-center justify-center"><Icon type={i===3?"finish":i===2?"ruler":"wood"} className="w-5 h-5"/></div>
                <div className="mt-auto">
                  <h3 className="font-heading italic text-3xl">{title}</h3>
                  <p className="text-sm text-white/75 font-light mt-2 leading-snug">{text}</p>
                </div>
              </GlassCard>
            </Reveal>)}
          </div>
        </div>
      </div>
    </section>

    {/* PRODUCTION / MACHINE */}
    <section id="production" className="relative min-h-screen bg-black overflow-hidden flex items-center">
      <FadingVideo src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4" className="absolute inset-0 w-full h-full object-cover z-0"/>
      <div className="relative z-10 w-full px-6 md:px-16 lg:px-20 py-24">
        <Reveal><p className="text-sm text-white/75 mb-6">// Производство</p></Reveal>
        <Reveal delay={.1}><h2 className="font-heading italic text-6xl md:text-7xl lg:text-[6rem] leading-[.9] tracking-[-3px] max-w-4xl">Технологии,<br/>которые работают<br/>с деревом</h2></Reveal>

        <div className="mt-8 grid lg:grid-cols-[1fr_1.4fr] items-center gap-4">
          <Reveal delay={.15}>
            <div className="max-w-md">
              <p className="text-white/85 font-light leading-snug">
                Лазерная и CNC-обработка превращает обычный лист материала в точную деталь, декоративную панель или уникальный элемент интерьера.
              </p>
              <div className="mt-6 space-y-3">
                {[["01","Проектирование"],["02","Точная резка"],["03","Шлифовка и отделка"]].map(([n,t])=>
                  <GlassCard key={n} className="px-4 py-3 flex items-center gap-4">
                    <span className="font-heading italic text-xl">{n}</span><span className="text-sm text-white/85">{t}</span>
                  </GlassCard>
                )}
              </div>
            </div>
          </Reveal>
          <Reveal delay={.25}><AnimatedMachine/></Reveal>
        </div>
      </div>
    </section>

    {/* PRODUCTS */}
    <section id="products" className="relative min-h-screen bg-black px-6 md:px-16 lg:px-20 pt-28 pb-20">
      <div className="relative z-10">
        <Reveal><p className="text-sm text-white/70 mb-6">// Что создаём</p></Reveal>
        <Reveal delay={.1}><h2 className="font-heading italic text-6xl md:text-7xl lg:text-[6rem] leading-[.9] tracking-[-3px] max-w-4xl">Из дерева<br/>для вашего пространства</h2></Reveal>
        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5 mt-16">
          {products.map(([title,text],i)=><Reveal key={title} delay={i*.06}>
            <motion.div whileHover={{y:-5}} className="liquid-glass rounded-[1.25rem] p-5 min-h-[300px] flex flex-col">
              <div className="flex justify-between items-start">
                <div className="text-xs text-white/50">0{i+1}</div>
                <div className="w-10 h-10 liquid-glass rounded-[.75rem] flex items-center justify-center"><Icon type={i===0?"wood":i===1?"ruler":i===2?"finish":"laser"} className="w-5 h-5"/></div>
              </div>
              <div className="mt-auto">
                <h3 className="font-heading italic text-4xl tracking-[-1px]">{title}</h3>
                <p className="text-sm text-white/75 font-light leading-snug mt-3 max-w-[35ch]">{text}</p>
                <a href="#contact" className="inline-flex mt-5 text-sm items-center gap-2">Обсудить <Icon type="arrow" className="w-4 h-4"/></a>
              </div>
            </motion.div>
          </Reveal>)}
        </div>
      </div>
    </section>

    {/* PROCESS */}
    <section className="relative min-h-screen bg-black px-6 md:px-16 lg:px-20 py-28">
      <Reveal><p className="text-sm text-white/70 mb-6">// Как это работает</p></Reveal>
      <Reveal delay={.1}><h2 className="font-heading italic text-6xl md:text-7xl lg:text-[6rem] leading-[.9] tracking-[-3px]">От идеи<br/>до готового изделия</h2></Reveal>
      <div className="grid md:grid-cols-4 gap-4 mt-16">
        {[
          ["01","Идея","Обсуждаем задачу, размеры, стиль и бюджет."],
          ["02","Проект","Подбираем материал и готовим точную модель."],
          ["03","Производство","Режем, фрезеруем, шлифуем и собираем."],
          ["04","Результат","Проверяем изделие и передаём его вам."]
        ].map(([n,t,d],i)=><Reveal key={n} delay={i*.08}>
          <GlassCard className="p-5 min-h-[260px] flex flex-col">
            <span className="font-heading italic text-4xl">{n}</span>
            <div className="mt-auto"><h3 className="font-heading italic text-3xl">{t}</h3><p className="text-sm text-white/70 font-light mt-2">{d}</p></div>
          </GlassCard>
        </Reveal>)}
      </div>
    </section>

    {/* CONTACT */}
    <section id="contact" className="relative min-h-[80vh] bg-black px-6 md:px-16 lg:px-20 py-28 flex items-center">
      <div className="w-full">
        <Reveal><p className="text-sm text-white/70 mb-6">// Ваш проект</p></Reveal>
        <Reveal delay={.1}><h2 className="font-heading italic text-6xl md:text-7xl lg:text-[6rem] leading-[.88] tracking-[-3px] max-w-5xl">Давайте создадим<br/>что-то настоящее</h2></Reveal>
        <Reveal delay={.2} className="mt-7 max-w-xl">
          <p className="text-white/75 font-light">Расскажите, что хотите создать — мы предложим материал, технологию и способ реализации.</p>
        </Reveal>
        <Reveal delay={.3} className="mt-7">
          <div className="flex flex-wrap gap-3">
            <a href="mailto:hello@example.com" className="liquid-glass-strong rounded-full px-6 py-3 text-sm font-medium flex items-center gap-2">Обсудить проект <Icon type="arrow" className="w-5 h-5"/></a>
            <a href="#products" className="liquid-glass rounded-full px-6 py-3 text-sm">Посмотреть работы</a>
          </div>
        </Reveal>
        <div className="mt-24 pt-6 border-t border-white/10 flex flex-col md:flex-row justify-between gap-4 text-xs text-white/50">
          <span className="font-heading italic text-2xl text-white">a</span>
          <span>Натуральные материалы · Современное производство</span>
          <span>© 2026</span>
        </div>
      </div>
    </section>
  </main>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
