<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ГРАНЬ — Remote Cinematic 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}#app{position:fixed;inset:0}
.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:24px;left:4vw;right:4vw;display:flex;justify-content:space-between}
.brand{font-size:12px;font-weight:800;letter-spacing:.38em}.status{font-size:9px;letter-spacing:.2em;color:#aaa;text-transform:uppercase}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c28b52;box-shadow:0 0 14px #c28b52;margin-right:8px}
.hero{position:absolute;left:7vw;bottom:10vh}.k{font-size:9px;letter-spacing:.35em;color:#a99f94;text-transform:uppercase;margin-bottom:16px}h1{font:400 clamp(52px,9vw,145px)/.82 Georgia,serif;letter-spacing:-.06em;margin:0 0 20px}h1 em{font-style:normal;color:#a88767}.sub{max-width:480px;color:#9d9790;font-size:13px;line-height:1.7}
.tag{position:absolute;right:4vw;bottom:28px;text-align:right;font-size:9px;letter-spacing:.18em;color:#777;text-transform:uppercase}.tag b{display:block;color:#ddd;margin-bottom:5px}
.loader{position:fixed;inset:0;background:#050505;z-index:10;display:grid;place-items:center;transition:opacity .7s}.loader.off{opacity:0;pointer-events:none}.loadbox{width:min(520px,80vw)}.loadtitle{font:400 38px Georgia,serif;margin-bottom:20px}.track{height:1px;background:#292929}.fill{height:100%;width:0;background:#b98750;transition:width .2s}.meta{display:flex;justify-content:space-between;margin-top:9px;font-size:8px;letter-spacing:.17em;text-transform:uppercase;color:#777}
.error{display:none;position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 36px));padding:24px;background:rgba(8,7,6,.96);border:1px solid #3b3025}.error strong{display:block;margin-bottom:10px}.error span{display:block;color:#aaa;font-size:12px;line-height:1.6}
.progress{position:absolute;left:0;bottom:0;height:2px;width:100%;background:#111}.progress i{display:block;height:100%;width:0;background:#b98750;box-shadow:0 0 18px #b98750}
@media(max-width:700px){.hero{left:6vw;bottom:9vh}.sub{max-width:330px;font-size:12px}.tag{bottom:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="ui">
<div class="top"><div class="brand">ГРАНЬ</div><div class="status"><span class="dot"></span><span id="status">CONNECTING 3D</span></div></div>
<div class="hero"><div class="k">Мебель · окна · точность</div><h1>Материал<br><em>становится формой.</em></h1><div class="sub">Одна непрерывная сцена: мастерская, станок, дерево, лазер и архитектура. Все внешние 3D-ассеты загружаются во время запуска.</div></div>
<div class="tag"><b id="phase">WORKSHOP / 01</b>scroll · drag</div><div class="progress"><i id="progress"></i></div>
</div>
<div class="loader" id="loader"><div class="loadbox"><div class="loadtitle">ГРАНЬ</div><div class="track"><div class="fill" id="fill"></div></div><div class="meta"><span id="loadmsg">Проверяем 3D-соединение…</span><span id="pct">0%</span></div></div></div>
<div class="error" id="error"><strong>Удалённые 3D-ассеты не загрузились</strong><span id="errtxt"></span></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const $=id=>document.getElementById(id);
const loaderUI=$("loader"),fill=$("fill"),pct=$("pct"),msg=$("loadmsg"),error=$("error"),errtxt=$("errtxt");
const setProgress=(n,t)=>{fill.style.width=n+"%";pct.textContent=n+"%";msg.textContent=t};
const fail=e=>{console.error(e);error.style.display="block";errtxt.textContent=(e?.message||String(e))+" Проверка: интернет, CORS и доступность CDN/API.";loaderUI.classList.add("off")};

try{
 const renderer=new THREE.WebGLRenderer({antialias:innerWidth>850,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.2:1.65));
 renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
 renderer.shadowMap.enabled=innerWidth>700;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 $("app").appendChild(renderer.domElement);

 const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);scene.fog=new THREE.FogExp2(0x050505,.025);
 const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.05,200);
 camera.position.set(8,5.4,12);
 const world=new THREE.Group();scene.add(world);
 const assets=new THREE.Group();world.add(assets);

 scene.add(new THREE.HemisphereLight(0x8b9aaa,0x16100b,2.2));
 const key=new THREE.SpotLight(0xffd2a0,110,35,Math.PI/5,.65,1.5);key.position.set(5,11,6);key.castShadow=innerWidth>700;scene.add(key);
 const rim=new THREE.PointLight(0x49637d,35,22);rim.position.set(-8,5,-6);scene.add(rim);
 const warm=new THREE.PointLight(0xff8a42,25,12);warm.position.set(1,2,1);scene.add(warm);

 const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x171412,roughness:.8,metalness:.08}));
 floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

 const metal=new THREE.MeshStandardMaterial({color:0x25282a,metalness:.9,roughness:.2});
 const dark=new THREE.MeshStandardMaterial({color:0x101214,metalness:.94,roughness:.16});
 function box(w,h,d,m,x,y,z,p=world){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;p.add(q);return q}
 const machine=new THREE.Group();machine.position.set(-1.6,0,-1.4);world.add(machine);
 box(5,.24,3.2,metal,0,.65,0,machine);
 for(const x of [-2.3,2.3])for(const z of [-1.35,1.35])box(.3,2.7,.3,dark,x,1.95,z,machine);
 box(5.1,.24,.3,dark,0,3.2,-1.38,machine);box(5.1,.24,.3,dark,0,3.2,1.38,machine);
 const head=box(.5,.5,.55,dark,0,2.7,0,machine);
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,2.1,8),new THREE.MeshBasicMaterial({color:0xff3b15,transparent:true,opacity:.9}));
 beam.position.set(0,1.55,0);machine.add(beam);

 const dustN=innerWidth<700?450:1200,arr=new Float32Array(dustN*3);
 for(let i=0;i<dustN;i++){arr[i*3]=(Math.random()-.5)*25;arr[i*3+1]=Math.random()*9;arr[i*3+2]=(Math.random()-.5)*20}
 const dg=new THREE.BufferGeometry();dg.setAttribute("position",new THREE.BufferAttribute(arr,3));
 scene.add(new THREE.Points(dg,new THREE.PointsMaterial({color:0xd4b38a,size:innerWidth<700?.018:.026,transparent:true,opacity:.24,depthWrite:false})));

 const gltf=new GLTFLoader();
 // Recursive resolver: current Poly Haven /files responses are nested trees.
 function firstURL(node,pred){
   if(!node||typeof node!=="object")return null;
   if(typeof node.url==="string"&&pred(node.url,node))return node.url;
   for(const k of Object.keys(node)){const v=firstURL(node[k],pred);if(v)return v}
   return null;
 }
 async function files(id){
   const r=await fetch("https://api.polyhaven.com/files/"+encodeURIComponent(id),{mode:"cors",cache:"no-store"});
   if(!r.ok)throw new Error("Poly Haven /files/"+id+" → HTTP "+r.status);
   return r.json();
 }
 async function modelURL(id){
   const d=await files(id);
   const u=firstURL(d,u=>/\\.(gltf|glb)(\\?|$)/i.test(u));
   if(!u)throw new Error("Не найден GLTF/GLB в ответе Poly Haven для "+id);
   return u;
 }
 function loadModel(id,label,pos,scale){
   return modelURL(id).then(url=>new Promise((resolve,reject)=>{
     gltf.load(url,g=>{
       const o=g.scene||g.scenes?.[0]; if(!o)return reject(new Error(label+": пустая сцена"));
       o.position.set(...pos);o.scale.setScalar(scale);o.userData.base=o.position.clone();o.userData.label=label;
       o.traverse(n=>{if(n.isMesh){n.castShadow=innerWidth>700;n.receiveShadow=true;if(n.material)n.material.envMapIntensity=1.15}});
       assets.add(o);resolve(o);
     },x=>{if(x.total)msg.textContent=label+" · "+Math.round(x.loaded/x.total*100)+"%"},reject);
   }));
 }

 setProgress(8,"Three.js подключён");
 // Real remote models; nothing is stored in this HTML.
 const jobs=[
   loadModel("wooden_table_02","WOOD / TABLE",[2.5,.05,-.5],2.2),
   loadModel("industrial_storage_cart","INDUSTRIAL CART",[-4,.05,-2],1.35),
   loadModel("utility_box_01","CONTROL BOX",[-5.3,.15,-5],1.15)
 ];
 const results=await Promise.all(jobs);
 results.forEach((_,i)=>setProgress(35+i*18,["Дерево загружено","Промышленный объект загружен","Детали мастерской загружены"][i]));
 setProgress(92,"Собираем кинематографическую сцену");
 $("status").textContent="REMOTE 3D / ONLINE";
 loaderUI.classList.add("off");

 let target=0,scroll=0,drag=false,lastX=0,rot=0,start=performance.now();
 addEventListener("wheel",e=>target=THREE.MathUtils.clamp(target+e.deltaY*.0005,0,1),{passive:true});
 addEventListener("pointerdown",e=>{drag=true;lastX=e.clientX});
 addEventListener("pointerup",()=>drag=false);
 addEventListener("pointermove",e=>{if(drag){rot+=(e.clientX-lastX)*.004;lastX=e.clientX}});
 addEventListener("touchmove",e=>{if(e.touches[0])target=THREE.MathUtils.clamp(target-e.touches[0].clientY*.000012,0,1)},{passive:true});

 function frame(){
   requestAnimationFrame(frame);const t=(performance.now()-start)/1000;
   scroll+=(target-scroll)*.045;
   const auto=(t*.035)%1,p=Math.max(scroll,auto);
   world.rotation.y=rot*.2;
   assets.children.forEach((o,i)=>{const b=o.userData.base;o.position.y=b.y+Math.sin(t*.35+i)*.035;o.rotation.y=Math.sin(t*.18+i)*.035});
   const cut=Math.max(0,Math.min(1,(p-.18)/.22));
   head.position.x=THREE.MathUtils.lerp(0,-1.65,cut);beam.position.x=head.position.x;beam.visible=p>.15&&p<.57;beam.scale.y=1+.25*Math.sin(t*18);
   let cp,look;
   if(p<.3){cp=new THREE.Vector3(6,4.2,12);look=new THREE.Vector3(0,1.8,0);$("phase").textContent="WORKSHOP / 01"}
   else if(p<.62){cp=new THREE.Vector3(3.7,3,7.8);look=new THREE.Vector3(-.6,1.8,-1.2);$("phase").textContent="CUTTING / 02"}
   else if(p<.82){cp=new THREE.Vector3(7,3.7,6);look=new THREE.Vector3(2.5,2,-.8);$("phase").textContent="ASSEMBLY / 03"}
   else{cp=new THREE.Vector3(8,4.1,3.2);look=new THREE.Vector3(4,2.4,-1.3);$("phase").textContent="ARCHITECTURE / 04"}
   camera.position.lerp(cp,.025);camera.lookAt(look);
   $("progress").style.width=(p*100).toFixed(1)+"%";
   renderer.render(scene,camera);
 }
 frame();
 addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.2:1.65));renderer.setSize(innerWidth,innerHeight)});
}catch(e){fail(e)}
</script>
</body></html>
