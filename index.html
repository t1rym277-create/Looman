<style>

:root {
  --bg: #120e0b;

}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--bg);
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 75% 20%, rgba(139,76,31,.13), transparent 30%),
    radial-gradient(circle at 15% 80%, rgba(101,54,25,.1), transparent 30%),
    var(--bg);
  color: white;
  font-family: Manrope, sans-serif;
  overflow-x: hidden;
}

/* ---------------- NOISE ---------------- */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  opacity: .035;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}

/* ---------------- GLASS ---------------- */

.glass {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.018)
    );
  border: 1px solid rgba(255,255,255,.095);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09),
    0 20px 60px rgba(0,0,0,.16);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.glass::after {
  content: "";
  position: absolute;
  width: 45%;
  height: 100%;
  top: 0;
  left: -70%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.06),
    transparent
  );
  transform: skewX(-18deg);
  transition: left .8s ease;
  pointer-events: none;
}

.glass:hover::after {
  left: 130%;
}

.glass-strong {
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.11),
      rgba(255,255,255,.025)
    );
  border: 1px solid rgba(255,255,255,.15);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    0 24px 70px rgba(0,0,0,.25);
}

/* ---------------- BUTTON ---------------- */

.btn {
  transition:
    transform .3s ease,
    background .3s ease,
    box-shadow .3s ease;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0) scale(.98);
}

/* ---------------- REVEAL ---------------- */

.reveal {
  opacity: 0;
  transform: translateY(35px);
  filter: blur(8px);
  transition:
    opacity .8s ease,
    transform .8s cubic-bezier(.2,.8,.2,1),
    filter .8s ease;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
}

/* ---------------- HERO ---------------- */

.hero-glow {
  position: absolute;
  width: 600px;
  height: 600px;
  right: -180px;
  top: 10%;
  background: radial-gradient(
    circle,
    rgba(196,118,48,.18),
    transparent 65%
  );
  filter: blur(30px);
  pointer-events: none;
}

.hero-grid {
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 70px 70px;
  mask-image: linear-gradient(to bottom, black, transparent 90%);
}

/* ---------------- WOOD ---------------- */

.wood-panel {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(
      115deg,
      #3a2417,
      #70462a 40%,
      #402719 70%,
      #21150e
    );
}

.wood-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .28;
  background:
    repeating-linear-gradient(
      4deg,
      transparent 0 15px,
      rgba(0,0,0,.18) 16px,
      transparent 17px 31px
    );
  mix-blend-mode: multiply;
}

/* ---------------- LASER ---------------- */

.laser-beam {
  animation: laserMove 3.8s ease-in-out infinite;
}

@keyframes laserMove {
  0%,100% {
    transform: translateX(-75px);
  }
  50% {
    transform: translateX(75px);
  }
}

.laser-dot {
  animation:
    laserPulse .8s ease-in-out infinite alternate;
}

@keyframes laserPulse {
  from {
    opacity: .45;
    transform: scale(.7);
  }
  to {
    opacity: 1;
    transform: scale(1.35);
  }
}

/* ---------------- PROJECTS ---------------- */

.project-image {
  transition: transform 1s cubic-bezier(.2,.7,.2,1);
}

.project:hover .project-image {
  transform: scale(1.055);
}

.project-overlay {
  background:
    linear-gradient(

      rgba(0,0,0,.85),

/* ---------------- MARQUEE ---------------- */

.marquee {
  animation: marquee 24s linear infinite;
}

@keyframes marquee {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}

/* ---------------- MATERIAL ---------------- */

.material-card {
  transition:
    transform .4s ease,
    border-color .4s ease;

.material-card:hover {
  transform: translateY(-6px);
  border-color: rgba(255,255,255,.25);

/* ---------------- CURSOR GLOW ---------------- */

.cursor-glow {

/* ---------------- MOBILE ---------------- */

@media(max-width: 768px) {

  .hero-glow {
    width: 350px;
    height: 350px;
    right: -180px;
  }

  .cursor-glow {

/* =========================================================
   CURSOR
========================================================= */

function CursorGlow() {

  const [pos,setPos] = useState({
    x:-500,
    y:-500
  });

  useEffect(() => {

    const move = e => {
      setPos({
        x:e.clientX,
        y:e.clientY
      });
    };

    window.addEventListener("mousemove",move);

    return () =>
      window.removeEventListener("mousemove",move);

  },[]);

  return (
    <div
      className="cursor-glow"
      style={{
        left:pos.x,
        top:pos.y
      }}
    />
  );
}

/* =========================================================
   APP
========================================================= */

function App() {

  useEffect(() => {

    const observer =
      new IntersectionObserver(
        entries => {

          entries.forEach(entry => {

            if(entry.isIntersecting) {

              entry.target.classList.add("visible");

            }

          });

        },
        {
          threshold:.12
        }
      );

    document
      .querySelectorAll(".reveal")
      .forEach(el => observer.observe(el));

    return () => observer.disconnect();

  },[]);


  return (

    <>

      <CursorGlow/>

      <Navbar/>

      <main>

        <Hero/>

        <div className="reveal">
          <Intro/>
        </div>

        <div className="reveal">
          <Capabilities/>
        </div>

        <Marquee/>

        <div className="reveal">
          <Projects/>
        </div>

        <div className="reveal">
          <Process/>
        </div>

        <div className="reveal">
          <Materials/>
        </div>

        <div className="reveal">
          <Contact/>
        </div>

      </main>

      <Footer/>

    </>

  );

}


ReactDOM
