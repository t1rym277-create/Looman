<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LASER / 3D Machine</title>

  <style>
    :root {
      --bg: #070909;
      --text: #f4f6f5;
      --muted: #8c9591;
      --accent: #7fffd4;
      --glass: rgba(255,255,255,.055);
      --line: rgba(255,255,255,.11);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    #webgl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: .075;
      background-image:
        radial-gradient(rgba(255,255,255,.55) .55px, transparent .55px);
      background-size: 4px 4px;
      mix-blend-mode: overlay;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%,
          transparent 22%,
          rgba(0,0,0,.18) 58%,
          rgba(0,0,0,.72) 100%);
    }

    .hud {
      position: fixed;
      z-index: 10;
      top: max(22px, env(safe-area-inset-top));
      left: 0;
      width: 100%;
      padding: 0 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .logo {
      letter-spacing: .18em;
      font-size: 13px;
      font-weight: 700;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(127,255,212,.9);
    }

    .copy {
      position: fixed;
      z-index: 8;
      left: 6vw;
      bottom: 10vh;
      max-width: 520px;
      pointer-events: none;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 112px);
      line-height: .84;
      letter-spacing: -.055em;
      font-weight: 700;
    }

    .copy p {
      color: #aab3af;
      font-size: clamp(13px, 1.4vw, 17px);
      line-height: 1.55;
      max-width: 420px;
      margin: 25px 0 0;
    }

    .scroll-hint {
      position: fixed;
      z-index: 8;
      right: 5vw;
      bottom: 7vh;
      writing-mode: vertical-rl;
      color: #8f9995;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .scroll-hint::before {
      content: "";
      display: block;
      width: 1px;
      height: 70px;
      margin: 0 auto 12px;
      background: linear-gradient(var(--accent), transparent);
    }

    .page {
      position: relative;
      z-index: 2;
      height: 500vh;
      pointer-events: none;
    }

    .section {
      height: 100vh;
      display: flex;
      align-items: center;
      padding: 8vw;
    }

    .glass-card {
      pointer-events: auto;
      padding: 22px 24px;
      border: 1px solid var(--line);
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.08),
        rgba(255,255,255,.025)
      );
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 18px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 25px 80px rgba(0,0,0,.25);
    }

    .metrics {
      position: fixed;
      z-index: 8;
      right: 5vw;
      top: 50%;
      transform: translateY(-50%);
      width: 150px;
      pointer-events: none;
    }

    .metric {
      padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .metric span {
      display: block;
      color: #6f7874;
      font-size: 8px;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .metric strong {
      font-size: 13px;
      font-weight: 500;
    }

    @media (max-width: 700px) {
      .metrics { display: none; }

      .copy {
        left: 7vw;
        right: 7vw;
        bottom: 10vh;
      }

      .copy p { max-width: 310px; }

      .scroll-hint { display: none; }
    }
  </style>
</head>

<body>
  <canvas id="webgl"></canvas>

  <div class="grain"></div>
  <div class="vignette"></div>

  <header class="hud">
    <div class="logo">LOOMAN / LASER</div>
    <div class="status">
      <span class="status-dot"></span>
      SYSTEM ONLINE
    </div>
  </header>

  <div class="copy">
    <div class="eyebrow">PRECISION WOOD / 01</div>
    <h1>LASER<br>ATELIER</h1>
    <p>
      Интерактивная сцена с работающим лазерным станком.
      Прокручивай страницу — камера приближается, а механизм
      разворачивается на 180°.
    </p>
  </div>

  <div class="metrics">
    <div class="metric">
      <span>Material</span>
      <strong>Metal / Glass</strong>
    </div>
    <div class="metric">
      <span>Finish</span>
      <strong>PBR 0.2</strong>
    </div>
    <div class="metric">
      <span>Mode</span>
      <strong>Active</strong>
    </div>
  </div>

  <div class="scroll-hint">SCROLL TO EXPLORE</div>

  <main class="page">
    <section class="section"></section>
    <section class="section"></section>
    <section class="section"></section>
    <section class="section"></section>
    <section class="section"></section>
  </main>

  <!-- Three.js + GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <script>
    (() => {
      "use strict";

      gsap.registerPlugin(ScrollTrigger);

      const canvas = document.querySelector("#webgl");

      /* =========================================================
         RENDERER
      ========================================================= */

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
      renderer.setSize(window.innerWidth, window.innerHeight);

      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      if ("outputColorSpace" in renderer) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
      }

      /* =========================================================
         SCENE / CAMERA
      ========================================================= */

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070909);
      scene.fog = new THREE.FogExp2(0x070909, 0.018);

      const camera = new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

      camera.position.set(0, 2.7, 8.8);

      /* =========================================================
         LIGHTING
      ========================================================= */

      const hemi = new THREE.HemisphereLight(
        0xbad8d0,
        0x080a09,
        1.4
      );
      scene.add(hemi);

      const key = new THREE.DirectionalLight(0xffffff, 4.0);
      key.position.set(-5, 8, 6);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.near = 0.1;
      key.shadow.camera.far = 30;
      key.shadow.camera.left = -8;
      key.shadow.camera.right = 8;
      key.shadow.camera.top = 8;
      key.shadow.camera.bottom = -8;
      scene.add(key);

      const rim = new THREE.PointLight(0x74ffe0, 3.2, 18);
      rim.position.set(4, 3.5, -2);
      scene.add(rim);

      const warm = new THREE.PointLight(0xffa45c, 2.0, 14);
      warm.position.set(-3, 2, 1);
      scene.add(warm);

      /* =========================================================
         PBR MATERIALS
         metalness: 0.8
         roughness: 0.2
      ========================================================= */

      const metalMaterial = new THREE.MeshStandardMaterial({
        color: 0x707875,
        metalness: 0.8,
        roughness: 0.2
      });

      const darkMetalMaterial = new THREE.MeshStandardMaterial({
        color: 0x171c1a,
        metalness: 0.8,
        roughness: 0.2
      });

      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x8cead5,
        metalness: 0.05,
        roughness: 0.08,
        transmission: 0.25,
        transparent: true,
        opacity: 0.35,
        clearcoat: 1,
        clearcoatRoughness: 0.08
      });

      const woodMaterial = new THREE.MeshStandardMaterial({
        color: 0x6c4226,
        metalness: 0.0,
        roughness: 0.48
      });

      const laserMaterial = new THREE.MeshBasicMaterial({
        color: 0x72ffe0
      });

      /* =========================================================
         MACHINE
      ========================================================= */

      const machine = new THREE.Group();
      machine.position.y = -0.2;
      scene.add(machine);

      const chassis = new THREE.Mesh(
        new THREE.BoxGeometry(5.7, 1.05, 4.2),
        darkMetalMaterial
      );
      chassis.position.y = 0.55;
      chassis.castShadow = true;
      chassis.receiveShadow = true;
      machine.add(chassis);

      const workSurface = new THREE.Mesh(
        new THREE.BoxGeometry(4.8, 0.22, 3.35),
        metalMaterial
      );
      workSurface.position.y = 1.15;
      workSurface.castShadow = true;
      machine.add(workSurface);

      /* Glass enclosure */
      const glassTop = new THREE.Mesh(
        new THREE.BoxGeometry(5.45, 2.35, 3.85),
        glassMaterial
      );
      glassTop.position.y = 2.35;
      glassTop.castShadow = true;
      machine.add(glassTop);

      /* Four structural pillars */
      const pillarGeo = new THREE.BoxGeometry(.28, 2.8, .28);

      [
        [-2.58, 2.1, -1.78],
        [ 2.58, 2.1, -1.78],
        [-2.58, 2.1,  1.78],
        [ 2.58, 2.1,  1.78]
      ].forEach(([x,y,z]) => {
        const p = new THREE.Mesh(pillarGeo, metalMaterial);
        p.position.set(x,y,z);
        p.castShadow = true;
        machine.add(p);
      });

      /* Gantry */
      const gantry = new THREE.Group();
      gantry.position.set(0, 3.05, -0.15);
      machine.add(gantry);

      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(4.9, .22, .28),
        metalMaterial
      );
      rail.castShadow = true;
      gantry.add(rail);

      const carriage = new THREE.Group();
      carriage.position.x = 0;
      gantry.add(carriage);

      const carriageBody = new THREE.Mesh(
        new THREE.BoxGeometry(.72, .48, .52),
        darkMetalMaterial
      );
      carriage.add(carriageBody);

      const laserHead = new THREE.Mesh(
        new THREE.CylinderGeometry(.14, .20, .55, 20),
        metalMaterial
      );
      laserHead.rotation.x = Math.PI / 2;
      laserHead.position.y = -.38;
      carriage.add(laserHead);

      /* Laser beam */
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(.018, .018, 2.1, 12),
        laserMaterial
      );
      beam.position.y = -1.35;
      beam.visible = true;
      carriage.add(beam);

      const beamGlow = new THREE.PointLight(0x73ffe0, 3.5, 3);
      beamGlow.position.y = -2.25;
      carriage.add(beamGlow);

      /* Wooden workpiece */
      const workpiece = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, .18, 1.45),
        woodMaterial
      );
      workpiece.position.set(0, 1.38, .25);
      workpiece.castShadow = true;
      machine.add(workpiece);

      /* Laser engraving lines */
      const engravingGroup = new THREE.Group();
      engravingGroup.position.set(0, 1.485, .25);
      machine.add(engravingGroup);

      for (let i = 0; i < 8; i++) {
        const line = new THREE.Mesh(
          new THREE.BoxGeometry(1.55 - i * .12, .012, .018),
          laserMaterial
        );
        line.position.z = -.48 + i * .14;
        line.material.transparent = true;
        line.material.opacity = .18 + i * .06;
        engravingGroup.add(line);
      }

      /* =========================================================
         WORKING MOTION
      ========================================================= */

      const machineState = {
        carriageX: 0,
        pulse: 0
      };

      gsap.to(machineState, {
        carriageX: 1.95,
        duration: 2.2,
        ease: "sine.inOut",
        repeat: -1,
        yoyo: true
      });

      /* =========================================================
         FLOATING 3D OBJECTS
      ========================================================= */

      const floating = new THREE.Group();
      scene.add(floating);

      const floatMaterial = new THREE.MeshStandardMaterial({
        color: 0x98a49f,
        metalness: 0.8,
        roughness: 0.2
      });

      const shapes = [
        new THREE.IcosahedronGeometry(.36, 1),
        new THREE.TorusGeometry(.28, .09, 16, 32),
        new THREE.OctahedronGeometry(.34, 1),
        new THREE.SphereGeometry(.27, 24, 24)
      ];

      for (let i = 0; i < 12; i++) {
        const obj = new THREE.Mesh(
          shapes[i % shapes.length],
          floatMaterial
        );

        const angle = i / 12 * Math.PI * 2;
        const radius = 4.3 + (i % 3) * .55;

        obj.position.set(
          Math.cos(angle) * radius,
          1.2 + (i % 4) * .72,
          -1.5 + Math.sin(angle) * radius * .42
        );

        obj.rotation.set(
          Math.random() * Math.PI,
          Math.random() * Math.PI,
          Math.random() * Math.PI
        );

        obj.userData = {
          baseY: obj.position.y,
          speed: .35 + Math.random() * .45,
          phase: Math.random() * Math.PI * 2
        };

        obj.castShadow = true;
        floating.add(obj);
      }

      /* =========================================================
         BACKGROUND PARTICLES
         Slow upward movement
      ========================================================= */

      const isMobile = window.innerWidth < 700;
      const particleCount = isMobile ? 650 : 1400;

      const particlePositions = new Float32Array(particleCount * 3);
      const particleSpeeds = new Float32Array(particleCount);

      for (let i = 0; i < particleCount; i++) {
        particlePositions[i * 3] =
          (Math.random() - .5) * 25;

        particlePositions[i * 3 + 1] =
          -5 + Math.random() * 16;

        particlePositions[i * 3 + 2] =
          -12 + Math.random() * 15;

        particleSpeeds[i] =
          .0007 + Math.random() * .0017;
      }

      const particleGeometry = new THREE.BufferGeometry();

      particleGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(particlePositions, 3)
      );

      const particleMaterial = new THREE.PointsMaterial({
        color: 0x9fffe9,
        size: isMobile ? .025 : .035,
        transparent: true,
        opacity: .42,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const particles = new THREE.Points(
        particleGeometry,
        particleMaterial
      );

      scene.add(particles);

      /* =========================================================
         SCROLL ANIMATION — GSAP ScrollTrigger
         Down = 180° rotation + camera approach
      ========================================================= */

      const scrollState = {
        rotationY: 0,
        cameraZ: 8.8,
        cameraY: 2.7,
        machineY: -.2,
        floatingY: 0
      };

      const scrollTimeline = gsap.timeline({
        scrollTrigger: {
          trigger: ".page",
          start: "top top",
          end: "bottom bottom",
          scrub: 1.25,
          invalidateOnRefresh: true
        }
      });

      scrollTimeline
        .to(scrollState, {
          rotationY: Math.PI,
          cameraZ: 3.65,
          cameraY: 2.35,
          machineY: -.55,
          floatingY: -.55,
          ease: "none",
          duration: 1
        }, 0)

        .to(".copy", {
          y: -100,
          opacity: 0,
          ease: "none",
          duration: .3
        }, .55)

        .to(".metrics", {
          opacity: 0,
          x: 50,
          ease: "none",
          duration: .25
        }, .62);

      /* Дополнительный parallax для плавающих объектов */
      gsap.to(floating.rotation, {
        y: Math.PI * 2,
        ease: "none",
        scrollTrigger: {
          trigger: ".page",
          start: "top top",
          end: "bottom bottom",
          scrub: 2
        }
      });

      /* =========================================================
         RESIZE
      ========================================================= */

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio, isMobile ? 1.25 : 1.75)
        );

        renderer.setSize(window.innerWidth, window.innerHeight);
        ScrollTrigger.refresh();
      });

      /* =========================================================
         ANIMATION LOOP
      ========================================================= */

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const t = clock.getElapsedTime();

        /* GSAP state → scene */
        machine.rotation.y = scrollState.rotationY;
        machine.position.y = scrollState.machineY;

        camera.position.z = scrollState.cameraZ;
        camera.position.y = scrollState.cameraY;

        camera.lookAt(
          machine.position.x,
          1.75 + scrollState.floatingY * .2,
          0
        );

        /* Рабочая лазерная головка */
        carriage.position.x = machineState.carriageX;

        beam.scale.y =
          .88 + Math.sin(t * 18) * .08;

        beamGlow.intensity =
          2.6 + Math.sin(t * 22) * .8;

        /* Световой блик по металлу */
        rim.position.x = 4 + Math.sin(t * .65) * 2.2;
        rim.position.z = -2 + Math.cos(t * .45) * 2;

        /* Плавающие объекты */
        floating.children.forEach((obj) => {
          obj.rotation.x += .0025 * obj.userData.speed;
          obj.rotation.y += .0040 * obj.userData.speed;

          obj.position.y =
            obj.userData.baseY +
            Math.sin(t * obj.userData.speed + obj.userData.phase) * .22;
        });

        /* Частицы медленно летят вверх */
        const positions =
          particleGeometry.attributes.position.array;

        for (let i = 0; i < particleCount; i++) {
          const yIndex = i * 3 + 1;

          positions[yIndex] += particleSpeeds[i];

          if (positions[yIndex] > 11) {
            positions[yIndex] = -5;
          }
        }

        particleGeometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
</body>
</html>
