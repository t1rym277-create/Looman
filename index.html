<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ГРАНЬ — мебель, окна и резьба по дереву</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ['"PT Serif"', 'serif'],
          body: ['Manrope', 'sans-serif'],
        },
      },
    },
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script>window.Motion = window.FramerMotion;</script>

<style>
  html, body { background:#14100D; }
  body { font-family: 'Manrope', sans-serif; }

  .liquid-glass {
    background: rgba(243,235,221,0.03);
    background-blend-mode: luminosity;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.35) 0%,
      rgba(255,255,255,0.10) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.10) 80%,
      rgba(255,255,255,0.35) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .liquid-glass-strong {
    background: rgba(243,235,221,0.05);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: none;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }
  .liquid-glass-strong::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.5) 0%,
      rgba(255,255,255,0.2) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.2) 80%,
      rgba(255,255,255,0.5) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  @keyframes cutDash {
    0%   { stroke-dashoffset: 1; opacity: 1; }
    85%  { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  .cut-path {
    stroke-dasharray: 1;
    animation: cutDash 6s linear infinite;
  }
  @keyframes pieceReveal {
    0%, 84%  { opacity: 0; }
    90%      { opacity: 0.95; }
    97%      { opacity: 0.95; }
    100%     { opacity: 0; }
  }
  .piece-reveal { animation: pieceReveal 6s linear infinite; }

  @keyframes sparkFlicker {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .spark { animation: sparkFlicker 0.9s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .cut-path, .piece-reveal, .spark { animation: none !important; }
  }

  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid #E8A33D; outline-offset: 2px; }
</style>
</head>
<body class="bg-[#14100D]">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { motion, useInView } = window.Motion;
const { useRef, useEffect, useState } = React;

/* ---------- Icons ---------- */
const ArrowUpRight = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M7 17L17 7" />
    <path d="M7 7h10v10" />
  </svg>
);
const Play = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="currentColor">
    <polygon points="6 4 20 12 6 20 6 4" />
  </svg>
);
const ClockIcon = ({ className }) => (
  <svg className={className} viewBox="0 0 28 28" fill="none" stroke="white" strokeWidth="1.6" strokeLinecap="round">
    <circle cx="14" cy="14" r="11" />
    <line x1="14" y1="14" x2="14" y2="8" />
    <line x1="14" y1="14" x2="18" y2="16.5" />
  </svg>
);
const TreeIcon = ({ className }) => (
  <svg className={className} viewBox="0 0 28 28" fill="none" stroke="white" strokeWidth="1.4">
    <ellipse cx="14" cy="14" rx="10" ry="8" />
    <ellipse cx="14" cy="14" rx="6" ry="4.6" />
    <ellipse cx="14" cy="14" rx="2.2" ry="1.7" />
  </svg>
);
const TargetIcon = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="currentColor">
    <path fillRule="evenodd" clipRule="evenodd" d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 4a6 6 0 110 12 6 6 0 010-12zm0 4a2 2 0 100 4 2 2 0 000-4z" />
  </svg>
);
const LinkIcon = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="currentColor">
    <path d="M7 12a5 5 0 015-5h2v2h-2a3 3 0 000 6h2v2h-2a5 5 0 01-5-5zm10-5h-2v2h2a3 3 0 010 6h-2v2h2a5 5 0 000-10z" />
  </svg>
);
const DropletIcon = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2C12 2 5 10.5 5 15a7 7 0 0014 0c0-4.5-7-13-7-13zm0 17a4 4 0 01-4-4c0-1.9 2.2-5.1 4-7.6 1.8 2.5 4 5.7 4 7.6a4 4 0 01-4 4z" />
  </svg>
);

/* ---------- BlurText ---------- */
function BlurText({ text, className }) {
  const ref = useRef(null);
  const inView = useInView(ref, { amount: 0.1, once: true });
  const words = text.split(" ");
  return (
    <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
      {words.map((word, i) => (
        <motion.span
          key={i}
          initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
          animate={inView ? { filter: ["blur(10px)", "blur(5px)", "blur(0px)"], opacity: [0, 0.5, 1], y: [50, -5, 0] } : {}}
          transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
          style={{ display: "inline-block", marginRight: "0.28em" }}
        >
          {word}
        </motion.span>
      ))}
    </p>
  );
}

/* ---------- LaserScene ---------- */
function LaserScene() {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    setReduced(mq.matches);
  }, []);

  const d = "M200,90 L170.3,98.4 L185.4,125.4 L158.4,110.3 L150,140 L141.6,110.3 L114.6,125.4 L129.7,98.4 L100,90 L129.7,81.6 L114.6,54.6 L141.6,69.7 L150,40 L158.4,69.7 L185.4,54.6 L170.3,81.6 Z";

  return (
    <div className="liquid-glass rounded-[1.5rem] p-6 w-full">
      <svg viewBox="0 0 300 184" className="w-full h-auto">
        <defs>
          <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#6B4326" />
            <stop offset="100%" stopColor="#4A2E1A" />
          </linearGradient>
          <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="2.6" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <rect x="20" y="20" width="260" height="144" rx="10" fill="url(#woodGrad)" />
        {[38, 58, 78, 126, 146, 164].map((y, i) => (
          <path key={i} d={`M28 ${y} C 90 ${y - 4}, 210 ${y + 4}, 272 ${y}`} stroke="rgba(0,0,0,0.18)" strokeWidth="1" fill="none" />
        ))}

        <path d={d} fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth="2" />
        <path
          className={reduced ? "" : "cut-path"}
          d={d}
          fill="none"
          stroke="#FF5A36"
          strokeWidth="2"
          pathLength="1"
          filter="url(#glow)"
          style={reduced ? { opacity: 1 } : {}}
        />
        <path className={reduced ? "" : "piece-reveal"} d={d} fill="#C9974B" fillOpacity="0.6" style={reduced ? { opacity: 0.6 } : { opacity: 0 }} />

        {!reduced && [
          [185.4, 54.6, "0s"], [185.4, 125.4, "0.3s"], [114.6, 54.6, "0.6s"], [114.6, 125.4, "0.15s"],
        ].map(([cx, cy, delay], i) => (
          <circle key={i} className="spark" cx={cx} cy={cy} r="1.6" fill="#FFD59A" filter="url(#glow)" style={{ animationDelay: delay }} />
        ))}

        {!reduced && (
          <g>
            <rect x="-7" y="-15" width="14" height="10" rx="2" fill="#221D18" stroke="#C8963E" strokeWidth="1" />
            <line x1="0" y1="-5" x2="0" y2="0" stroke="#FF5A36" strokeWidth="1.6" filter="url(#glow)" />
            <circle cx="0" cy="0" r="2.4" fill="#FF5A36" filter="url(#glow)" />
            <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.85;0.98;1" calcMode="linear" rotate="auto">
              <mpath href={"#cutPathRef"} />
            </animateMotion>
          </g>
        )}
        <path id="cutPathRef" d={d} fill="none" stroke="none" />
      </svg>
    </div>
  );
}

/* ---------- Navbar ---------- */
function Navbar() {
  const links = ["Главная", "Мебель", "Окна", "Резьба", "Материалы"];
  return (
    <nav className="fixed top-4 left-0 right-0 z-50 px-6 lg:px-16">
      <div className="max-w-7xl mx-auto flex items-center justify-between">
        <div className="liquid-glass w-12 h-12 rounded-full flex items-center justify-center">
          <span className="font-heading italic text-white text-2xl">Г</span>
        </div>
        <div className="hidden lg:flex liquid-glass rounded-full px-1.5 py-1.5 items-center gap-1">
          {links.map((l) => (
            <a key={l} href="#" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">{l}</a>
          ))}
          <a href="#" className="flex items-center gap-1.5 bg-white text-black rounded-full px-4 py-2 text-sm font-medium whitespace-nowrap ml-1 hover:bg-white/90 transition-colors">
            Обсудить проект <ArrowUpRight className="w-4 h-4" />
          </a>
        </div>
        <a href="#" className="lg:hidden flex items-center gap-1.5 bg-white text-black rounded-full px-4 py-2.5 text-sm font-medium whitespace-nowrap hover:bg-white/90 transition-colors">
          Обсудить проект <ArrowUpRight className="w-4 h-4" />
        </a>
        <div className="hidden lg:block w-12 h-12 opacity-0" />
      </div>
    </nav>
  );
}

/* ---------- Hero ---------- */
function Hero() {
  const fadeUp = (delay) => ({
    initial: { filter: "blur(10px)", opacity: 0, y: 20 },
    animate: { filter: "blur(0px)", opacity: 1, y: 0 },
    transition: { duration: 0.8, delay, ease: "easeOut" },
  });
  return (
    <section className="relative min-h-screen bg-[#14100D] flex flex-col">
      <Navbar />
      <div className="flex-1 flex flex-col justify-center px-6 lg:px-16 pt-28 pb-10">
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 items-center max-w-7xl mx-auto w-full">
          <div className="flex flex-col items-center lg:items-start text-center lg:text-left">
            <motion.div {...fadeUp(0.2)} className="liquid-glass rounded-full pl-1 pr-3 py-1 flex items-center gap-2 mb-6">
              <span className="bg-white text-black px-3 py-1 rounded-full text-xs font-semibold">Цех</span>
              <span className="text-sm text-white/90 font-body">Собственное производство полного цикла</span>
            </motion.div>

            <BlurText
              text="Дерево, огранённое светом"
              className="font-heading italic text-white text-5xl md:text-6xl lg:text-[4.6rem] leading-[0.95] tracking-[-1px] justify-center lg:justify-start"
            />

            <motion.p {...fadeUp(0.6)} className="mt-5 text-base text-white/85 font-body font-light leading-snug max-w-md">
              Лазерная резка и ручная столярная сборка превращают массив дерева в мебель, окна и предметы интерьера, которые служат десятилетиями.
            </motion.p>

            <motion.div {...fadeUp(0.9)} className="flex flex-wrap items-center justify-center lg:justify-start gap-6 mt-7">
              <a href="#" className="liquid-glass-strong rounded-full px-5 py-2.5 text-sm font-medium text-white flex items-center gap-2 hover:brightness-110 active:brightness-95 transition-[filter]">
                Рассчитать стоимость <ArrowUpRight className="w-5 h-5" />
              </a>
              <a href="#" className="text-white text-sm font-medium flex items-center gap-2 hover:text-white/70 transition-colors">
                <Play className="w-4 h-4" /> Посмотреть примеры работ
              </a>
            </motion.div>

            <motion.div {...fadeUp(1.1)} className="flex items-stretch gap-4 mt-10 w-full max-w-[400px] lg:max-w-none lg:w-auto">
              <div className="liquid-glass p-5 flex-1 min-w-0 sm:flex-none sm:w-[190px] rounded-[1.25rem]">
                <ClockIcon className="w-7 h-7" />
                <div className="font-heading italic text-white text-3xl tracking-[-1px] leading-none mt-4">12 лет</div>
                <div className="text-xs text-white/80 font-body font-light mt-2">Опыт производства мебели и окон</div>
              </div>
              <div className="liquid-glass p-5 flex-1 min-w-0 sm:flex-none sm:w-[190px] rounded-[1.25rem]">
                <TreeIcon className="w-7 h-7" />
                <div className="font-heading italic text-white text-3xl tracking-[-1px] leading-none mt-4">9 пород</div>
                <div className="text-xs text-white/80 font-body font-light mt-2">От сосны до чёрного ореха</div>
              </div>
            </motion.div>
          </div>

          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.9, delay: 0.5 }}>
            <LaserScene />
          </motion.div>
        </div>
      </div>

      <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ duration: 0.8, delay: 1.2 }} className="flex flex-col items-center gap-4 pb-8 px-6">
        <div className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white text-center">
          Работаем с дизайнерами интерьеров и архитекторами
        </div>
        <div className="flex flex-wrap justify-center gap-x-6 gap-y-2 md:gap-x-12">
          {["Дуб", "Ясень", "Орех", "Сосна", "Лиственница"].map((w) => (
            <span key={w} className="font-heading italic text-white text-lg md:text-2xl tracking-tight">{w}</span>
          ))}
        </div>
      </motion.div>
    </section>
  );
}

/* ---------- Capabilities ---------- */
const CARDS = [
  {
    Icon: TargetIcon,
    title: "Лазерная резка",
    tags: ["Точность 0.1 мм", "Резьба по контуру", "Без сколов", "Любая форма"],
    body: "Каждую деталь проектируем в CAD и вырезаем лазером — кромка получается чистой, без сколов и лишней шлифовки.",
  },
  {
    Icon: LinkIcon,
    title: "Ручная сборка",
    tags: ["Шип-паз", "Массив дерева", "Без ДСП", "Проверка на нагрузку"],
    body: "Столяры собирают каркас на шиповых соединениях без гвоздей и ДСП. Перед отправкой каждое изделие проверяем на прочность.",
  },
  {
    Icon: DropletIcon,
    title: "Натуральное покрытие",
    tags: ["Масло и воск", "Влагостойкость", "Живая текстура", "Без лака"],
    body: "Покрываем маслом и воском вместо лака: дерево дышит, сохраняет текстуру и легко обновляется через годы.",
  },
];

function Capabilities() {
  return (
    <section className="relative min-h-screen bg-[#14100D] px-6 md:px-16 lg:px-20 py-24">
      <div className="max-w-7xl mx-auto">
        <h2 className="font-heading italic text-white text-5xl md:text-6xl lg:text-[5rem] leading-[0.95] tracking-[-1px] max-w-2xl">
          От бревна к готовому изделию
        </h2>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
          {CARDS.map(({ Icon, title, tags, body }) => (
            <div key={title} className="liquid-glass rounded-[1.25rem] p-6 min-h-[340px] flex flex-col">
              <div className="flex items-start justify-between gap-4">
                <div className="liquid-glass w-11 h-11 rounded-[0.75rem] flex items-center justify-center">
                  <Icon className="w-6 h-6 text-white" />
                </div>
                <div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
                  {tags.map((t) => (
                    <span key={t} className="liquid-glass rounded-full px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">{t}</span>
                  ))}
                </div>
              </div>
              <div className="flex-1" />
              <div className="mt-6">
                <h3 className="font-heading italic text-white text-3xl tracking-[-1px] leading-none">{title}</h3>
                <p className="mt-3 text-sm text-white/85 font-body font-light leading-snug max-w-[34ch]">{body}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function App() {
  return (
    <div className="bg-[#14100D]">
      <Hero />
      <Capabilities />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
